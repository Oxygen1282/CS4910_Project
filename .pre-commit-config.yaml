# Install once per clone:  uv run pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Use the project's own ruff (pinned in uv.lock) so local and CI results match.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      # Security code must not contain characters a reviewer can't see (Trojan Source).
      - id: no-hidden-unicode
        name: no hidden Unicode in source
        entry: uv run python scripts/escape_invisible.py
        language: system
        types: [text]
      # Dogfooding: scan this repo's own agent files (demo/ holds intentional poison).
      - id: memtegrity-scan
        name: memtegrity scan
        entry: uv run memtegrity scan --exclude demo/
        language: system
        pass_filenames: true
        files: (^|/)(CLAUDE(\.local)?\.md|AGENTS\.md|GEMINI\.md|\.cursorrules|\.windsurfrules|\.clinerules|\.mcp\.json|copilot-instructions\.md)$|(^|/)(\.claude|\.cursor/rules|\.windsurf/rules|\.github/instructions|\.clinerules)/
