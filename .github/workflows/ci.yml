name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # reused by release.yml

permissions:
  contents: read

jobs:
  check:
    # Memtegrity must work wherever Claude Code runs (the demo is on macOS; Windows is
    # supported too), so every check runs on all three.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # Git Bash on Windows, the same shell Claude Code runs hooks with
    env:
      # CI must never call the real Claude API. No key is provided on purpose.
      ANTHROPIC_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      - name: Validate plugin JSON
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json hooks/hooks.json; do
            uv run python -m json.tool "$f" > /dev/null && echo "ok  $f"
          done

      - name: No hidden Unicode in source
        run: uv run python scripts/escape_invisible.py $(git ls-files '*.py' '*.md' '*.json' '*.toml' '*.yml' '*.yaml')

      - name: Scan agent instruction files (dogfooding)
        run: uv run memtegrity scan . --exclude demo/

      - name: Tests
        run: uv run pytest
