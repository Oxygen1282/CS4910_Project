name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # reused by release.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # CI must never call the real Claude API. No key is provided on purpose.
      ANTHROPIC_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      - name: Validate plugin JSON
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json hooks/hooks.json; do
            uv run python -m json.tool "$f" > /dev/null && echo "ok  $f"
          done

      - name: Tests
        run: uv run pytest
